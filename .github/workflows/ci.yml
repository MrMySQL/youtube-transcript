name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-check-lock

  tests:
    name: Tests (PHP ${{ matrix.php-version }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [locked]
        include:
          - php-version: '8.2'
            dependencies: lowest
          - php-version: '8.5'
            dependencies: highest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: ${{ matrix.php-version == '8.2' && matrix.dependencies == 'locked' && 'pcov' || 'none' }}
          tools: composer:v2

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        if: ${{ !(matrix.php-version == '8.2' && matrix.dependencies == 'locked') }}
        run: vendor/bin/phpunit

      - name: Run tests with coverage
        if: ${{ matrix.php-version == '8.2' && matrix.dependencies == 'locked' }}
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ matrix.php-version == '8.2' && matrix.dependencies == 'locked' }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  static-analysis:
    name: Psalm
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/psalm --no-cache --output-format=github --threads=2
